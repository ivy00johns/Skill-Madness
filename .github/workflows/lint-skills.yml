name: Skill Lint

# Trigger on every push to any branch and on PRs targeting main.
# This ensures lint failures are caught both during feature development
# and at the merge gate.
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same ref on rapid pushes.
# Saves CI minutes and reduces queue congestion without losing coverage.
concurrency:
  group: lint-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary blocking job. A non-zero exit from lint-skills.sh fails the PR.
  lint-ubuntu:
    name: Lint Skills (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # python3 is preinstalled on ubuntu-latest; this step confirms
      # availability and surfaces the version in the job log.
      - name: Verify python3
        run: python3 --version

      # bats-core is used by lint-skills.sh for test execution.
      # The apt package is named 'bats' on Ubuntu.
      # Refresh the package index first — older runner images can 404
      # against stale package URLs.
      - name: Install bats-core
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bats

      # First pass: capture JUnit output regardless of exit code.
      # The '|| true' prevents early failure so the artifact is always
      # produced before the authoritative gate run below.
      - name: Run lint (capture JUnit report)
        run: scripts/lint-skills.sh --format junit > lint-results.xml || true

      # Second pass: real gate. Exits non-zero on any lint violation,
      # which marks the job failed. No '|| true' here — intentional.
      - name: Run lint (enforce pass/fail)
        run: scripts/lint-skills.sh skills/

      # Upload the JUnit XML even when the job fails so reviewers can
      # inspect which rules fired without re-running locally.
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results-ubuntu
          path: lint-results.xml

  # Hooks layer: lint the hooks/ tree and run its bats suite.
  # Additive job — independent of the skill lint gate above. Uses only static
  # run commands (no GitHub event input), so no injection surface.
  hooks-ubuntu:
    name: Hooks Layer (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify python3
        run: python3 --version

      - name: Install bats-core
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bats

      # Static lint of the hooks tree (manifest, executability, script headers,
      # profile validity). Non-zero exit fails the job.
      - name: Lint hooks layer
        run: scripts/lint-hooks.sh

      # Behavioral bats suite for the wrapper, qa-gate, convert emission, and
      # lint-hooks itself.
      - name: Run hooks bats suite
        run: bash tests/hooks/run-tests.sh

  # Installer discipline (P1): assert the advertised skill counts match disk
  # (catalog-as-CI-invariant) and run the plan/apply + catalog bats suites.
  # Additive job — independent of the gates above. Static run commands only.
  installer-ubuntu:
    name: Installer + Catalog (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify python3
        run: python3 --version

      - name: Install bats-core
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bats

      # Catalog-as-CI-invariant: fails the build if README / plugin.json /
      # marketplace.json skill counts have drifted from the filesystem.
      - name: Catalog count check
        run: scripts/catalog.sh --check

      # Behavioral bats: catalog (--check/--sync/--text) and the plan/apply
      # install lifecycle (plan → apply → list → drift → repair → uninstall).
      - name: Run catalog bats suite
        run: bats tests/catalog

      - name: Run plan/apply bats suite
        run: bats tests/install-plan

  # Skill supply-chain / injection scan (P2): deterministic, LLM-free gate over
  # the skills tree (secrets, prompt-injection, zero-width unicode, untrusted
  # composes_with). Blocks the build on any HIGH finding. Static commands only.
  security-ubuntu:
    name: Skill Scan (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify python3
        run: python3 --version

      - name: Install bats-core
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bats

      # Blocking: non-zero exit on any HIGH-severity finding (secrets, private
      # keys, zero-width unicode). MEDIUM/LOW are reported but do not fail.
      - name: Scan skills (block on HIGH)
        run: scripts/scan-skills.sh --check skills/

      - name: Run scan-skills bats suite
        run: bats tests/scan-skills

  # Frontmatter standard (P3): enforce the Portable Skill Frontmatter Spec
  # (PSFS) as a real gate. The main lint job's schema cross-check degrades to
  # an advisory when jsonschema is absent — this job installs it so the
  # portable schema validates the whole tree authoritatively. Static commands
  # only; no GitHub event input.
  standard-ubuntu:
    name: Frontmatter Standard / PSFS (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify python3
        run: python3 --version

      # The portable reference validator needs jsonschema; pyyaml parses the
      # frontmatter. --break-system-packages is required on PEP 668 Pythons.
      - name: Install jsonschema + pyyaml
        run: python3 -m pip install --user --break-system-packages jsonschema pyyaml

      - name: Install bats-core
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bats

      # Bind: the bash reference implementation reports the standard it serves.
      - name: Report standard binding
        run: scripts/lint-skills.sh --standard

      # Authoritative gate: every real SKILL.md must validate against the
      # portable schema. With jsonschema installed, lint-skills.sh runs the
      # schema cross-check inline and fails on any structural violation.
      - name: Lint with schema enforcement
        run: scripts/lint-skills.sh skills/

      # Behavioral suite: --standard output, schema well-formedness, the
      # real-tree gate, and the positive/negative fixtures.
      - name: Run frontmatter-standard bats suite
        run: bash tests/standard/run-tests.sh

  # Smoke-check on macOS to catch bash 3.2 compatibility quirks.
  # Not a merge gate — continue-on-error prevents macOS-only failures
  # from blocking PRs authored on Linux/Windows.
  lint-macos:
    name: Lint Skills (macOS)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # python3 is preinstalled on macos-latest runners.
      - name: Verify python3
        run: python3 --version

      # PyYAML is not preinstalled on macos-latest (it is on ubuntu-latest).
      # Without it, the linter falls back to a degraded check that flags
      # every skill — install it so the smoke job mirrors Ubuntu coverage.
      # --break-system-packages is required on PEP 668-managed Pythons.
      - name: Install pyyaml
        run: python3 -m pip install --user --break-system-packages pyyaml

      # brew is preinstalled on macos-latest. The package is 'bats-core'
      # (not 'bats') on Homebrew — distinct from the Ubuntu apt package name.
      - name: Install bats-core
        run: brew install bats-core

      # Same two-pass pattern as Ubuntu: capture report first, gate second.
      - name: Run lint (capture JUnit report)
        run: scripts/lint-skills.sh --format junit > lint-results.xml || true

      - name: Run lint (enforce pass/fail)
        run: scripts/lint-skills.sh skills/

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results-macos
          path: lint-results.xml
